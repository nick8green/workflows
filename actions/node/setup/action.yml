name: "setup node.js"
description: "Sets up Node.js, detects the package manager, authenticates, caches, and installs dependencies"

inputs:
  version:
    description: "Version of Node.js to use (falls back to .nvmrc if not provided, and defaults to 24.x if neither is set)"
    required: false
  registry:
    default: "npm.pkg.github.com"
    description: "Hostname of the npm registry to use (do not include the protocol)"
    required: false

runs:
  using: "composite"
  steps:
    # -- 1. Resolve Node.js version -----------------------------------------------
    - id: get-version
      name: 🧮 get version
      run: |
        if [ -f ".nvmrc" ]; then
          NODE_VERSION=$(cat .nvmrc | sed -E 's/^v?//g;t')
        elif [ -n "${{ inputs.version }}" ]; then
          NODE_VERSION="${{ inputs.version }}"
        else
          NODE_VERSION="24.x"
        fi
        echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    # -- 2. Detect package manager ------------------------------------------------
    - id: detect-pm
      name: 💼 detect package manager
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          PM=pnpm
        elif [ -f "yarn.lock" ]; then
          PM=yarn
          if [ -f ".yarnrc.yml" ] || \
             ([ -f "package.json" ] && grep -q '"packageManager".*yarn@[^1]' package.json 2>/dev/null); then
            echo "yarn-berry=true" >> "$GITHUB_OUTPUT"
          else
            echo "yarn-berry=false" >> "$GITHUB_OUTPUT"
          fi
        elif [ -f "package-lock.json" ]; then
          PM=npm
        else
          echo "::error:: No known lockfile found. Cannot determine package manager." >&2
          exit 1
        fi
        echo "manager=$PM" >> "$GITHUB_OUTPUT"
      shell: bash

    # -- 3. Enable corepack if using Yarn Berry or pnpm----------------------------
    #    Corepack reads `packageManager` from package.json and installs the
    #    exact version — no need for a separate pnpm/action-setup step.
    - if: |
        steps.detect-pm.outputs.manager == 'pnpm' || 
        steps.detect-pm.outputs.yarn-berry == 'true'
      name: ⚙️ enable corepack
      run: corepack enable
      shell: bash

    # -- 4. Install pnpm via dedicated action (classic fallback) ------------------
    #    Only used when Corepack is NOT handling it (i.e. no `packageManager`
    #    field). Safe to remove if all your projects declare `packageManager`.
    - if: |
        steps.detect-pm.outputs.manager == 'pnpm' && 
        steps.detect-pm.outputs.yarn-berry != 'true'
      name: 🛠️ pnpm setup (action fallback)
      uses: pnpm/action-setup@v4
      with:
        version: latest

    # -- 5. Setup Node.js with the resolved version -------------------------------
    #    Comes after corepack and pnpm setup to ensure the correct Node version is
    #    used for package manager installation.
    - name: ⚙️ setup node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.get-version.outputs.version }}

    # ── 4b. Configure Yarn Berry cache directory ───────────────────────────────
    - id: yarn-berry-cache
      if: steps.detect-pm.outputs.yarn-berry == 'true'
      name: 🫐 configure yarn berry cache
      run: |
        # Ensure the cache folder is set to a known, consistent path
        yarn config set cacheFolder ~/.yarn/berry/cache
        CACHE_DIR=$(yarn config get cacheFolder)
        echo "cache-dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
      shell: bash

    # -- 6. Authenticate with the registry ----------------------------------------
    #    TOKEN is sourced from the environment. Callers should set NODE_AUTH_TOKEN
    #    in their jobs `env:` block.
    #
    #    Yarn Berry: reads the NODE_AUTH_TOKEN directly from .yarnrc via the
    #    ${NODE_AUTH_TOKEN} placeholder. There is nothing extra required.
    #
    #    Yarn Classic: needs to set the auth token in .yarnrc via `yarn config set`
    #    command.
    #
    #    npm: needs to set the auth token in .npmrc.
    - if: steps.detect-pm.outputs.manager == 'npm'
      name: 🔓 authenticate with npm
      run: |
        echo "@nick8green:registry=https://${{ inputs.registry }}/" >> ~/.npmrc
        echo "//${{ inputs.registry }}/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      shell: bash

    - if: |
        steps.detect-pm.outputs.manager == 'yarn' && 
        steps.detect-pm.outputs.yarn-berry == 'false'
      name: 🔓 authenticate with yarn
      run: yarn set config npmScopes.nick8green.npmAuthToken "${NODE_AUTH_TOKEN}"
      shell: bash

    # After your "setup node.js" step, add:
    - if: steps.detect-pm.outputs.yarn-berry == 'true'
      name: 🔓 authenticate with yarn berry
      run: |
        yarn config set npmScopes.nick8green.npmAuthToken "${NODE_AUTH_TOKEN}"
        yarn config set npmScopes.nick8green.npmAlwaysAuth true
        yarn config set npmScopes.nick8green.npmRegistryServer "https://${{ inputs.registry }}"
      shell: bash

    # -- 7. Cache dependencies ----------------------------------------------------
    - id: cache-deps
      name: 📦 cache dependencies
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-deps-${{ steps.detect-pm.outputs.manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
        path: |
          ~/.npm
          ${{ steps.yarn-berry-cache.outputs.cache-dir || '~/.yarn/berry/cache' }}
          ~/.yarn
          ~/.pnpm-store
          node_modules
          packages/*/node_modules
        restore-keys: |
          ${{ runner.os }}-deps-${{ steps.detect-pm.outputs.manager }}-

    # -- 8. Install dependencies --------------------------------------------------
    - if: steps.cache-deps.outputs.cache-hit != 'true'
      name: 📥 install dependencies
      run: |
        case "${{ steps.detect-pm.outputs.manager }}" in
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          yarn)
            if [ "${{ steps.detect-pm.outputs.yarn-berry }}" = "true" ]; then
              # Berry picks up NODE_AUTH_TOKEN automatically via .yarnrc.yml
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
          npm)
            npm ci
            ;;
        esac
      shell: bash
