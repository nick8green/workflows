name: build and publish application image

on:
  workflow_call:
    inputs:
      args:
        default: ''
        description: 'Additional arguments to pass to the build'
        required: false
        type: string
      context:
        default: '.'
        description: 'Path to the build context'
        required: false
        type: string
      file:
        default: './Dockerfile'
        description: 'Path to the Dockerfile'
        required: false
        type: string
      reference:
        description: 'Reference to the image'
        required: true
        type: string
      registry:
        default: 'ghcr.io'
        description: 'Registry to push to'
        required: false
        type: string
      platform:
        default: 'linux/arm64,linux/amd64'
        description: 'Platform(s) to build for'
        required: false
        type: string
        # Supported platforms:
        #   - linux/amd64
        #   - linux/arm/v7
        #   - linux/arm64/v8
        #   - linux/ppc64le
        #   - linux/s390x
      push:
        default: true
        description: 'Push to registry'
        required: false
        type: boolean
      tag:
        description: 'Tag for the image'
        required: false
        type: string
      timeout:
        default: 10
        description: 'Timeout in minutes'
        required: false
        type: number
      user:
        default: ${{ github.actor }}
        description: 'Username for the registry'
        required: false
        type: string
    secrets:
      password:
        description: 'Password for the registry. PAT for GitHub (with: read and write access to packages), or password for Docker Hub'
        required: true
      token:
        description: 'GitHub token in case the image wants it'
        required: false
      docker:
        description: 'Docker password for Docker Scout'
        required: false

jobs:
  build:
    name: 🏗️ build and publish image
    outputs:
      image: ${{ steps.meta.outputs.labels }}
      tags: ${{ steps.meta.outputs.tags }}
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Free space inside Docker's storage (/var/lib/docker)
      - name: 🧹 Free Docker disk space
        run: |
          docker ps -aq | xargs -r docker rm -f
          docker images -aq | xargs -r docker rmi -f
          docker builder prune -af
          docker system prune -af --volumes

      - name: 🔑 login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.user }}
          password: ${{ secrets.password }}

      - name: 📋 docker meta data
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.registry }}/${{ inputs.reference }}
          labels: |
            org.opencontainers.image.authors=${{ inputs.user }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.description=${{ inputs.reference }} image from ${{ github.repository }} by ${{ github.actor }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=nick8green
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            ${{ inputs.tag && format('type=raw,value={0}', inputs.tag) || '' }}

      - name: 🧱 set up qemu
        uses: docker/setup-qemu-action@v4

      - name: 🧱 set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host
          use: true
          keep-state: false
          cache-binary: true
          cleanup: true

      - name: 🧱 configure buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🏗️ build and push
        uses: docker/build-push-action@v6
        with:
          build-args: ${{ inputs.args }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platform }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          network: host
          secrets: |
            GH_TOKEN=${{ secrets.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: tag
        name: 🏷️ determine image tag
        run: |
          echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)" >> $GITHUB_OUTPUT
    timeout-minutes: ${{ inputs.timeout }}

  scout:
    if: ${{ inputs.push }}
    name: 🔭 docker scout scan
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.user }}
          password: ${{ secrets.password }}

      - name: 🔭 docker scout cves
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: ${{ needs.build.outputs.tag }}
          dockerhub-user: ${{ inputs.user }}
          dockerhub-password: ${{ secrets.docker }}
          only-severities: critical,high,medium,low,unknown
          sarif-file: scout.sarif
          summary: true
          exit-code: false

      - name: 🔭 docker scout cves
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: ${{ needs.build.outputs.tag }}
          dockerhub-user: ${{ inputs.user }}
          dockerhub-password: ${{ secrets.docker }}
          only-severities: critical,high
          sarif-file: scout.sarif
          summary: true
          exit-code: true

  trivy:
    if: ${{ inputs.push }}
    name: 🔍 trivy scan for vulnerabilities
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.user }}
          password: ${{ secrets.password }}

      - continue-on-error: true
        name: 🕵 Run and report full image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.tag }}
          format: table
          exit-code: 1
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          
      - name: 🕵 Run critical and high image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.tag }}
          format: table
          exit-code: 1
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          skip-setup-trivy: true
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
