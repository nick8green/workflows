name: inspect code

on:
  workflow_call:
    secrets:
      token:
        description: 'GitHub token with access to the npm registry'
        required: true

jobs:
  inspect:
    env:
      NODE_AUTH_TOKEN: ${{ secrets.token }}
    name: 🧐 inspect code
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ checkout code
        uses: actions/checkout@v4

      - id: setup
        name: 🧱 setup workspace
        uses: nick8green/workflows/actions/node/setup@node-setup

      - name: 🔍 lint code
        shell: bash
        run: |
          case "${{ steps.setup.outputs.package-manager }}" in
            pnpm) pnpm lint ;;
            yarn) yarn lint ;;
            npm)  npm run lint ;;
          esac

      - name: ⚠️ audit dependencies
        shell: bash
        run: |
          case "${{ steps.setup.outputs.package-manager }}" in
            pnpm)
              pnpm audit
              ;;
            yarn)
              if [ "${{ steps.setup.outputs.yarn-berry }}" = "true" ]; then
                yarn npm audit
              else
                yarn audit
              fi
              ;;
            npm)
              npm audit
              ;;
          esac
        
